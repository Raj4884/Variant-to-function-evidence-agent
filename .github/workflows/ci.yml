name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Eval harness smoke test (synthetic fixtures, plumbing only)
        run: python eval/run_eval.py --ag2 data/fixtures/ag2_scores.csv --ot data/fixtures/ot_credible_sets.json
