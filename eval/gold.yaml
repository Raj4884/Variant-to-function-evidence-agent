# Gold loci for the harness.
#
# split: paper_example      -> the locus is a worked example in the AlphaGenome 2 paper
#                              (so AG2 was shaped by / reported on it; do not use it to claim generalisation)
#        heldout_candidate  -> well-known locus NOT used as an example in the paper.
#                              Targets come from the literature, from memory. VERIFY each one
#                              against the primary paper before reporting any metric.
#
# direction = effect of the ALT allele (hg38 ref>alt, as scored by AG2) on target gene expression.
#   null = not verified; those loci are left out of the direction metric.
#   Directions were written from memory and NOT checked against the paper, except where noted.
# context = tissue terms implied by the TRAIT the variant is associated with (LDL/CAD -> liver, BMI -> adipose).
#   Only set where the trait makes the tissue obvious; used by the "with trait context" evaluation.
#   Deliberately broader than the expected cell type ('liver', not 'hepatocyte').
# cell_types = lowercase substrings that count as a hit. The synonym lists (e.g. 'type ii pneumocyte' for AT2,
#   'esc' for endometrial stromal cell) were added AFTER seeing AG2 output, by biological equivalence.
#   Treat cell_type_hit as descriptive, not as an unbiased metric. Proper fix: Cell Ontology ids.
loci:
  - {rsid: rs2836882,  gene: ETS2,   cell_types: [macrophage, monocyte, myeloid, dendritic, neutrophil],  direction: null,   split: paper_example}
  - {rsid: rs12913832, gene: OCA2,   cell_types: [melanocyte],            direction: down, split: paper_example}
  - {rsid: rs6497271,  gene: OCA2,   cell_types: [melanocyte],            direction: down, split: paper_example}
  - {rsid: rs1175550,  gene: SMIM1,  cell_types: [erythroblast, erythrocyte, erythroid],  direction: up,   split: paper_example}
  - {rsid: rs6673829,  gene: SMIM1,  cell_types: [erythroblast, erythrocyte, erythroid],  direction: down, split: paper_example}
  - {rsid: rs2038740,  gene: SCUBE3, cell_types: [chondrocyte],           direction: up,   split: paper_example}
  - {rsid: rs13066062, gene: CXCR6,  cell_types: [cd8, nk, t cell],           direction: down, split: paper_example}
  - {rsid: rs35705950, gene: MUC5B,  cell_types: [at2, type ii pneumocyte],                   direction: up,   split: paper_example}
  - {rsid: rs3820282,  gene: WNT4,   cell_types: [stromal, esc],               direction: up,   split: paper_example}
  # gene may be a list: any listed gene counts as correct.
  # rs1421085: target genes IRX3 and IRX5 are listed by the Alsheikh 2022 review table of experimentally validated
  #   non-coding variants (BMC Med Genomics, PMC8973751, 'distal enhancer', obesity). The primary paper (Claussnitzer
  #   2015 NEJM, PMID 26287746) was NOT read. Direction left null: not verified.
  - {rsid: rs1421085,  gene: [IRX3, IRX5], cell_types: [preadipocyte],    direction: null, split: heldout_candidate, context: [adipo]}
  # rs12740374: Musunuru 2010 Nature, PMID 20686566 (abstract + text read via PMC3062476): the minor allele creates a
  #   C/EBP site and raises hepatic SORT1 expression. Direction 'up' assumes ALT (T) is the minor allele.
  - {rsid: rs12740374, gene: SORT1,  cell_types: [hepatocyte],            direction: up,   split: heldout_candidate, context: [liver]}
